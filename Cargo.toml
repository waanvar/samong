[package]
name = "samong"
version = "0.3.8"
edition = "2021"
license = "Apache-2.0"
description = "Local-first, Obsidian-compatible knowledge base with Thai full-text search"
repository = "https://github.com/waanvar/samong"
keywords = ["knowledge-base", "notes", "markdown", "thai", "search"]
categories = ["command-line-utilities", "text-processing"]
homepage = "https://samong.dev"
readme = "README.md"
# Measured, not guessed: the highest MSRV any dependency declares is 1.88.0
# (`cargo metadata` reports it), and a clean build on that exact toolchain was
# verified before this line was written. Without it, someone on an older Rust
# gets a wall of compiler errors instead of one sentence naming the version.
rust-version = "1.88"

# An explicit file list, because `cargo package` otherwise honours .gitignore —
# and `web/dist` is gitignored. The published crate would then carry an empty
# `web/dist/.gitkeep`, so `cargo install samong` would give you a server with no
# web UI at all: the launcher would open a browser onto nothing. `include`
# overrides .gitignore, which is the only way to get the built UI in.
#
# `include` is a whitelist: anything absent here is absent from the crate. Add to
# it when a new directory becomes load-bearing. The test
# `the_published_package_contains_the_built_web_ui` fails if the UI goes missing.
# Every pattern is anchored with a leading slash. Cargo reads these as
# gitignore-style globs, where a bare `README.md` matches at *any* depth — the
# first version of this list pulled in 149 files from `web/node_modules`
# (77 README.md, 67 LICENSE, 5 CHANGELOG.md belonging to npm packages).
include = [
    "/src/**/*",
    # The newmm dictionary is `include_str!`d by src/thai.rs, so the crate does
    # not compile without it. Left out of the first version of this list, which
    # `cargo publish --dry-run` catches — and crates.io versions are immutable,
    # so publishing it would have burned 0.3.6 permanently.
    "/assets/**/*",
    "/web/dist/**/*",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD-PARTY.md",
]

# MSVC PDBs balloon the target dir past several GB; tests don't need them.
[profile.dev]
debug = false

[features]
default = []
# Semantic search: embed notes locally and rank by meaning as well as by words.
#
# Off by default, and the published binaries are built without it, because it
# changes what the program *is*: it pulls in ONNX Runtime, and the first run has
# to fetch a model from Hugging Face. Notes still never leave the machine — but
# "one binary, nothing to download" stops being true, and that promise is the
# reason people pick this over a cloud tool. Anyone who wants meaning-based
# search can opt in and accept the trade; nobody has it imposed.
semantic = ["dep:fastembed"]

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive"] }
# rustls, not native-tls: the rest of the tree already speaks rustls, and
# native-tls would drag OpenSSL into a binary that currently needs no system
# library. `image-models` is off — this indexes Markdown.
fastembed = { version = "5.17.4", optional = true, default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
ignore = "0.4.31"
nlpo3 = "1.4.0"
notify = "8.2.0"
open = "5.4.0"
redb = "2.6.3"
regex = "1.13.0"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
# `compression-zip-deflate` is not optional in practice, despite the name.
# `archive-zip` alone lets the crate *read* a zip but only decompress STORED
# entries, so `samong update` on Windows failed with "Compression method not
# supported" on every release — every file in the archive is deflated. The
# tar side needed `compression-flate2` for the same reason.
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tantivy = "0.26.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "1.1.3"
# Format-preserving TOML, only for writing into the user's samong.toml when a
# vault is installed. `toml` would round-trip the file and silently delete their
# comments and ordering; a config people hand-edit must survive being edited by us.
toml_edit = "0.24.1"
tower-http = { version = "0.7.0", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
futures-util = "0.3.32"
predicates = "3.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
