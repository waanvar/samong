[package]
name = "samong"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local-first, Obsidian-compatible knowledge base with Thai full-text search"
repository = "https://github.com/waanvar/samong"
keywords = ["knowledge-base", "notes", "markdown", "thai", "search"]
categories = ["command-line-utilities", "text-processing"]

# MSVC PDBs balloon the target dir past several GB; tests don't need them.
[profile.dev]
debug = false

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.31"
nlpo3 = "1.4.0"
notify = "8.2.0"
open = "5.4.0"
redb = "2.6.3"
regex = "1.13.0"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "rustls", "archive-tar", "archive-zip", "compression-flate2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tantivy = "0.26.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "1.1.3"
tower-http = { version = "0.7.0", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
futures-util = "0.3.32"
predicates = "3.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
