# Read by `cargo audit`, which the Audit workflow runs against Cargo.lock.
#
# An ignored advisory is a claim that the vulnerable code cannot be reached from
# this program, and it is only worth making in writing. Anything ignored without
# a reason below should be treated as unreviewed and removed.
#
# The list is empty, and that is the intended state. It held two quick-xml
# advisories — RUSTSEC-2026-0194 and RUSTSEC-2026-0195 — carried because the
# parser arrived as a mandatory dependency of `self_update` 0.44 for an S3
# backend Samong never calls. `self_update` 1.x makes it optional behind a
# feature this build does not enable, so the parser is no longer compiled in:
# the entries went away with the dependency rather than by anyone deciding they
# had aged out. An ignore is a debt, and the way to clear one is to remove the
# code it was hiding.

[advisories]
ignore = []
