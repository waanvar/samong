name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # --locked everywhere: CI has to judge the dependency set we actually ship,
      # not whatever resolved newest this morning. Without it a green CI says
      # nothing about the binaries the release workflow builds, and an upstream
      # release can turn main red with no change of ours.
      - name: Build
        run: cargo build --all --locked --verbose

      - name: Test
        run: cargo test --all --locked --verbose

      - name: Clippy
        run: cargo clippy --all --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # The `semantic` feature is off by default and the release binaries never carry
  # it, so nothing else in this file would ever compile it. It still has to be
  # kept working, and it cannot be checked on every machine: the prebuilt ONNX
  # Runtime that `ort` downloads is compiled against a newer MSVC STL than some
  # Windows toolchains ship, which links with 40 unresolved `__std_*_element`
  # symbols. Linux links it cleanly, so this is where the feature gets verified.
  #
  # The model download is deliberately not exercised — it is 465 MB from Hugging
  # Face and would make CI slow and network-dependent. What runs here is
  # everything up to the model: compile, link, the vector store, and chunking.
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test with semantic search compiled in
        run: cargo test --features semantic --locked --verbose

      - name: Clippy
        run: cargo clippy --features semantic --all-targets --locked -- -D warnings

  # What `cargo publish` would actually upload.
  #
  # The web UI is embedded at compile time from `web/dist`, which is gitignored —
  # so `cargo package` excludes it unless `include` in Cargo.toml overrides that.
  # Get this wrong and `cargo install samong` yields a server with no interface
  # and a launcher that opens a browser onto nothing. Neither the `test` job
  # (no Node) nor the `web` job (no Rust) can see it, which is why this exists.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The package must carry the built UI
        run: |
          cargo package --list --locked --allow-dirty > /tmp/pkg.txt
          echo "--- web/ entries in the package ---"
          grep '^web/' /tmp/pkg.txt || true
          for required in web/dist/index.html assets/words_th.txt Cargo.toml README.md LICENSE NOTICE THIRD-PARTY.md; do
            grep -qx "$required" /tmp/pkg.txt || { echo "::error::$required is missing from the published package"; exit 1; }
          done
          # Assets are hashed filenames, so assert by count rather than by name.
          n=$(grep -c '^web/dist/assets/' /tmp/pkg.txt || true)
          [ "$n" -gt 0 ] || { echo "::error::no built assets in the package"; exit 1; }
          echo "package carries the UI: $n asset file(s)"

      # `--allow-dirty` is unavoidable — `include` deliberately packages the
      # gitignored `web/dist` — so prove first that the *only* dirty paths are
      # that generated UI. Without this the flag hides uncommitted source edits,
      # which is the warning it exists to give.
      - name: Nothing dirty except the built UI
        run: bash packaging/check-publish-tree.sh

      - name: Dry-run the publish
        run: cargo publish --dry-run --locked --allow-dirty

      # v0.3.7's registry publish was rejected for a description of 168 characters
      # against a documented limit of 100. The limit was in the schema all along;
      # reading a schema is not validating against it.
      - name: server.json must satisfy the registry schema
        run: python3 packaging/mcpb/validate-server-json.py server.json

      # The icons are generated and committed, so the committed copies have to be
      # intact. The check reads the pixels, not just the headers: the first render
      # of the 128px icon was three quarters empty while being a perfectly valid
      # PNG of the right dimensions, and it would have gone into both the .ico and
      # the .icns to be wrong at exactly one size.
      - name: The committed icons are complete
        run: |
          python3 -m pip install --quiet pillow
          python3 packaging/icons/make-icons.py --check

  # winget: the manifests are generated, so the committed copies must be exactly
  # what the generator produces — otherwise they drift and Microsoft's validation
  # pipeline is the thing that finds out, days after the pull request.
  #
  # Installing needs a Windows runner and an administrator setting that this
  # project's own machine will not be asked to change, so this job is where a
  # local-manifest install is actually exercised.
  winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: The committed manifests are what the generator produces
        run: python packaging/winget/generate.py --check

      - name: winget's own validator
        shell: pwsh
        run: winget validate --manifest packaging\winget\manifests

      - name: Install from the manifests
        shell: pwsh
        run: |
          # Runners are disposable and administrative, so enabling local manifests
          # here costs nothing. On a real machine this is a setting a person has to
          # choose for themselves.
          winget settings --enable LocalManifestFiles
          winget install --manifest packaging\winget\manifests `
            --accept-package-agreements --accept-source-agreements
          "$env:LOCALAPPDATA\Microsoft\WinGet\Links" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Every portable alias answers, and it finds notes
        shell: pwsh
        run: |
          foreach ($b in @("samong","samong-server","samong-mcp","samong-app")) {
            $cmd = Get-Command $b -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "$b was not aliased onto PATH" }
            "  $b -> $($cmd.Source)"
          }
          samong --version
          $env:SAMONG_CONFIG_DIR = "$env:RUNNER_TEMP\winget-config"
          $vault = "$env:RUNNER_TEMP\winget-vault"
          New-Item -ItemType Directory -Force $vault | Out-Null
          Set-Content "$vault\Runbook.md" "# Runbook`n`nwhen the queue backs up, drain it`n" -Encoding utf8
          Set-Content "$vault\Thai.md" "# Thai`n`nสถาบันวิจัยแห่งประเทศไทยประกาศผลการศึกษา`n" -Encoding utf8
          Push-Location $vault
          # Out-String first: -match against an array filters instead of returning a
          # boolean, which once made a passing search look like a failure.
          if ((samong search queue | Out-String) -notmatch "Runbook") { throw "search failed" }
          if ((samong search "ประเทศไทย" | Out-String) -notmatch "Thai") { throw "Thai segmentation failed" }
          Pop-Location
          "search and Thai segmentation work through the winget install"

  # The AUR package, built and installed inside an Arch container.
  #
  # `.SRCINFO` is what the AUR actually parses to show a package's version, and it
  # can only be produced by `makepkg --printsrcinfo` — which needs Arch. A PKGBUILD
  # updated without regenerating it is the classic AUR mistake: the site keeps
  # advertising the old version. So it is regenerated here and compared.
  #
  # Docker rather than a `container:` job, so `actions/checkout` runs on the host
  # and nothing depends on the Arch image happening to satisfy the runner's needs.
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build, inspect and install the package
        run: |
          docker run --rm -v "$PWD:/work" archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed namcap python git >/dev/null

            # makepkg refuses to run as root, so the package is built by a user.
            useradd -m builder
            cp -r /work/packaging/aur /home/builder/pkg
            chown -R builder:builder /home/builder/pkg

            sudo -u builder bash -euo pipefail -c "
              cd /home/builder/pkg

              python generate.py --check

              makepkg --printsrcinfo > .SRCINFO.generated
              if [ ! -f .SRCINFO ]; then
                echo \"::error::.SRCINFO is missing. Commit this, produced by makepkg --printsrcinfo:\"
                echo \"--- 8< ---\"; cat .SRCINFO.generated; echo \"--- >8 ---\"
                exit 1
              fi
              if ! diff -u .SRCINFO .SRCINFO.generated; then
                echo \"::error::.SRCINFO does not match the PKGBUILD. The AUR reads .SRCINFO, so it would advertise the wrong version. Correct content is above as the + side.\"
                exit 1
              fi
              echo \".SRCINFO matches the PKGBUILD\"

              # Downloads the release archive and verifies it against sha256sums.
              makepkg -f --noconfirm
            "

            cd /home/builder/pkg
            namcap PKGBUILD
            namcap ./*.pkg.tar.zst
            pacman -U --noconfirm ./*.pkg.tar.zst

            for b in samong samong-server samong-mcp samong-app; do
              command -v "$b" >/dev/null || { echo "::error::$b not installed"; exit 1; }
              echo "  $b -> $(command -v $b)"
            done
            samong --version
            samong-server --version
            test -f /usr/share/applications/samong.desktop
            test -f /usr/share/licenses/samong-bin/LICENSE
            echo "desktop entry and licence installed"

            # What the program is for, not just that it starts. The Thai line only
            # matches if the word-segmentation dictionary was compiled in.
            export SAMONG_CONFIG_DIR=/tmp/samong-config
            mkdir -p /tmp/vault && cd /tmp/vault
            printf "# Runbook\n\nwhen the queue backs up, drain it\n\nSee [[Escalation]].\n" > Runbook.md
            printf "# Escalation\n\nwake the on-call\n" > Escalation.md
            printf "# Thai\n\nสถาบันวิจัยแห่งประเทศไทยประกาศผลการศึกษา\n" > Thai.md
            samong search queue | grep -q Runbook || { echo "::error::search did not find the note"; exit 1; }
            samong links Runbook | grep -q Escalation || { echo "::error::the wikilink did not resolve"; exit 1; }
            samong search ประเทศไทย | grep -q Thai || { echo "::error::Thai segmentation failed — is the dictionary in the binary?"; exit 1; }
            echo "search, links and Thai segmentation all work from the installed package"
          '

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (includes type-check)
        working-directory: web
        run: npm run build

      # The share card is served from a versioned filename so that Facebook and X
      # refetch it instead of serving their cached copy. The cost of that is a new
      # way to fail silently: bump the tag, forget the PNG, and the page still
      # returns 200 while every shared link goes back to being bare text. Nothing
      # else here reads those tags.
      - name: Every og:image the page promises must exist, at the size claimed
        run: python3 packaging/site/make-social-card.py --meta-only
