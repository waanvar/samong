name: Landing page

# Manual only, on purpose. Publishing a public page is an outward-facing act, so
# it happens when someone presses the button — not as a side effect of a push.
# To publish on every push to main, add:
#   push:
#     branches: [main]
#     paths: ["site/**", ".github/workflows/site.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page is plain HTML with self-hosted fonts — nothing to build, and no
      # third-party requests at runtime.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
