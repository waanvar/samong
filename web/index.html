<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samong</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      // Priority: ?theme= override, then saved preference, then the OS.
      const fromUrl = new URLSearchParams(location.search).get("theme");
      const saved = localStorage.getItem("samong-theme");
      const preferred =
        fromUrl ||
        saved ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = preferred;

      // Same three sources for the language, so Thai text is laid out with the
      // right font from the first frame. src/i18n.ts is the authority and
      // re-applies this on load; here it only avoids a reflow.
      const asked = new URLSearchParams(location.search).get("lang");
      const tag = (asked || localStorage.getItem("samong-lang") || navigator.language || "en")
        .toLowerCase()
        .split("-")[0];
      document.documentElement.lang = tag === "th" ? "th" : "en";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
