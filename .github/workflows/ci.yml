name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # --locked everywhere: CI has to judge the dependency set we actually ship,
      # not whatever resolved newest this morning. Without it a green CI says
      # nothing about the binaries the release workflow builds, and an upstream
      # release can turn main red with no change of ours.
      - name: Build
        run: cargo build --all --locked --verbose

      - name: Test
        run: cargo test --all --locked --verbose

      - name: Clippy
        run: cargo clippy --all --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (includes type-check)
        working-directory: web
        run: npm run build
