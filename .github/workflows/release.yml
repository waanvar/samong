name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild an existing tag by hand.
  #
  # Without this, a tag push is the only way to run a release build, so a single
  # failed or stranded job means the only fix is burning a new version number —
  # which is exactly what happened to v0.3.0 and v0.3.1, both of which are still
  # missing their Intel Mac archive because the runner they asked for had been
  # retired. Assets with the same name are replaced, which is the point.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.3.2"
        required: true
        type: string

permissions:
  contents: write

env:
  # A manual run is given the tag; a tag push already is one. Everything below
  # reads this, so the two paths cannot drift.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            archive: tar
          - os: windows-latest
            target: x86_64-windows
            archive: zip
          - os: macos-latest
            target: aarch64-macos
            archive: tar
          # Intel Macs are still a meaningful share. This used to ask for a
          # `macos-13` runner to build natively; that image has been retired, so
          # the job sat queued forever — v0.3.0 waited nearly six hours and never
          # produced this archive. Cross-compiling from the arm64 runner needs no
          # special image: macOS ships both slices of the SDK.
          - os: macos-latest
            target: x86_64-macos
            archive: tar
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run would otherwise build the default branch and label the
          # archives with a tag they were not built from.
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build binaries
        shell: bash
        # --locked: a release must build from the committed Cargo.lock, not from
        # whatever resolved newest today.
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --release --bins --locked --target "${{ matrix.rust_target }}"
          else
            cargo build --release --bins --locked
          fi

      - name: Package
        shell: bash
        run: |
          name="samong-${TAG}-${{ matrix.target }}"
          # A cross build lands under target/<triple>/release instead.
          bin="target/release"
          if [ -n "${{ matrix.rust_target }}" ]; then
            bin="target/${{ matrix.rust_target }}/release"
          fi
          mkdir -p "stage/$name"
          cp "$bin"/samong* "stage/$name/" 2>/dev/null || true
          rm -f "stage/$name/"*.d "stage/$name/"*.pdb
          # The web UI is embedded into samong-server, so the archive is just
          # the binaries + docs. NOTICE and THIRD-PARTY.md must travel with the
          # binaries: Apache-2.0 requires attribution to survive redistribution.
          cp README.md LICENSE NOTICE THIRD-PARTY.md "stage/$name/"

          # Something to double-click. `samong-app` is in the archive already;
          # what each platform needs is the shell that makes it launchable
          # without a terminal, which is the whole point of shipping it.
          case "${{ matrix.target }}" in
            *windows*)
              # Built for the windows subsystem, so no console window opens.
              #
              # NOT "Samong.exe": Windows filesystems are case-insensitive, so
              # that name *is* samong.exe and this copy silently replaced the CLI
              # in the v0.3.3 archive. "Open Samong.exe" cannot collide, and says
              # what to do with it.
              cp "$bin/samong-app.exe" "stage/$name/Open Samong.exe"
              ;;
            *macos*)
              bash packaging/macos/make-app.sh "$bin" "stage/$name" "${TAG#v}"
              ;;
            *linux*)
              cp packaging/linux/samong.desktop "stage/$name/"
              ;;
          esac
          cp packaging/README.md "stage/$name/DOUBLE-CLICK.md"

          # Assert before archiving. The v0.3.3 Windows archive was wrong and
          # every job was green, because nothing checked.
          bash packaging/verify-stage.sh "stage/$name" "${{ matrix.target }}"

          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$name.zip" "$name"
            archive="$name.zip"
          else
            tar czf "../$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          cd ..

          # A second copy under a name with no version in it.
          #
          # The landing page had four download buttons labelled by platform and
          # architecture, and all four pointed at the releases page, because a
          # direct link needs the exact filename and every filename carries the
          # version. Someone clicking "Windows · x86_64 · zip" landed on a list of
          # eight files and had to work out which one — for exactly the audience
          # the double-click launcher exists for.
          #
          # `releases/latest/download/<name>` resolves against the newest release,
          # so an unversioned alias is a permanent link that never needs the
          # website to know the version. The cost is uploading each archive twice;
          # the versioned name stays because "which build is this" has to remain
          # answerable from the filename alone.
          alias="samong-${{ matrix.target }}.${{ matrix.archive == 'zip' && 'zip' || 'tar.gz' }}"
          cp "$archive" "$alias"

          # One checksum per name, not one shared: `sha256sum -c` matches on the
          # filename recorded inside the file, so a checksum naming the versioned
          # archive would simply fail against the alias.
          sum() {
            if command -v sha256sum >/dev/null; then sha256sum "$1" > "$1.sha256"
            else shasum -a 256 "$1" > "$1.sha256"; fi
          }
          sum "$archive"
          sum "$alias"

          # Both names must exist and be the same bytes, or the permanent link
          # points at something other than the release it claims to be.
          [ -f "$archive" ] && [ -f "$alias" ] || { echo "missing archive or alias" >&2; exit 1; }
          cmp "$archive" "$alias" || { echo "alias is not a copy of the archive" >&2; exit 1; }
          echo "published as $archive and $alias"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, because a manual run is not triggered by a tag and the
          # action would otherwise have nothing to attach the files to.
          tag_name: ${{ env.TAG }}
          files: |
            samong-*.zip
            samong-*.tar.gz
            samong-*.sha256

  # crates.io, once every archive is built and uploaded.
  #
  # A separate job that `needs: build`, so a platform that fails to build stops
  # the publish: crates.io versions are immutable, and a version published
  # against a broken release cannot be taken back — only yanked, which still
  # burns the number.
  #
  # Requires a CARGO_REGISTRY_TOKEN secret. Without it this job fails loudly
  # rather than skipping quietly, because a release that silently stops
  # publishing is how `cargo install samong` drifts a version behind and nobody
  # notices.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The UI is embedded at compile time and `web/dist` is gitignored, so it has
      # to be built here before packaging or the crate ships without an interface.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The package must carry the UI and the dictionary
        run: |
          cargo package --list --locked > /tmp/pkg.txt
          for required in web/dist/index.html assets/words_th.txt; do
            grep -qx "$required" /tmp/pkg.txt || { echo "::error::$required missing from the crate"; exit 1; }
          done

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Same reasoning as CI: the built UI is packaged on purpose and is
          # gitignored, so `cargo publish` needs --allow-dirty. Checked first so
          # the flag cannot smuggle anything else out. Without --allow-dirty this
          # step fails with "55 files ... not yet committed".
          bash packaging/check-publish-tree.sh
          cargo publish --locked --allow-dirty

  # The MCP bundle, and the registry entry that points at it.
  #
  # Runs on macOS because `lipo` lives there: the manifest has one `darwin` key
  # and macOS has two architectures, so the two Mac builds have to be fused into a
  # universal binary or half of Mac users get a bundle that cannot execute.
  #
  # Inputs are the archives this release just published, not a rebuild — the
  # bundle then contains exactly the bytes users download.
  mcp-registry:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write  # GitHub OIDC proves the io.github.waanvar namespace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download this release's archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p archives
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir archives             --pattern "samong-${TAG}-*.tar.gz" --pattern "samong-${TAG}-*.zip"
          ls -l archives

      - name: Build the bundle
        run: bash packaging/mcpb/build.sh "${TAG#v}" "$PWD/archives" "$PWD/dist"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 samong-mcp.mcpb > samong-mcp.mcpb.sha256
          cat samong-mcp.mcpb.sha256

      - name: Upload the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/samong-mcp.mcpb
            dist/samong-mcp.mcpb.sha256

      # Written here rather than committed: a hash in git would be a claim about a
      # file that does not exist yet, and the version would drift the moment it is
      # bumped. The script validates the digest and the URL before writing.
      - name: Point server.json at what was just published
        run: |
          python3 packaging/mcpb/point-server-json.py             server.json             "${TAG#v}"             "$(shasum -a 256 dist/samong-mcp.mcpb | cut -d' ' -f1)"             "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/samong-mcp.mcpb"

      # --require-published: the registry fetches the URL itself and refuses an
      # entry it cannot reach, so this runs after the upload and checks the same
      # things — reachable bundle, real digest — before the publish is attempted.
      - name: server.json must satisfy the registry, including the live bundle
        run: python3 packaging/mcpb/validate-server-json.py server.json --require-published

      - name: Publish to the MCP registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_darwin_arm64.tar.gz"             | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Confirm the registry has it
        run: |
          sleep 10
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.waanvar/samong"             | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2)[:1200])"

  # A pull request into microsoft/winget-pkgs, which is where winget packages
  # actually live — the manifests in this repo are the source, not the listing.
  #
  # Needs a WINGET_TOKEN secret: a fine-grained PAT with public-repo access, used
  # to fork winget-pkgs and open the pull request under your account. Submitting to
  # someone else's repository cannot be done with GITHUB_TOKEN.
  #
  # Skipped rather than failed when the secret is absent. Unlike crates.io — where a
  # missed publish silently drifts and must be loud — a winget submission waits in
  # Microsoft's review queue anyway, so a release that did not open a pull request
  # is a decision, not a defect.
  winget:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Is there a token to submit with?
        id: gate
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no WINGET_TOKEN secret, so no winget pull request was opened. Add one to automate it, or run wingetcreate by hand."
          fi

      - name: Generate the manifests for this release
        shell: bash
        run: |
          python packaging/winget/generate.py --version "${TAG#v}"
          python packaging/winget/generate.py --check

      - name: winget's own validator
        shell: pwsh
        run: winget validate --manifest packaging\winget\manifests

      - name: Submit the pull request
        if: steps.gate.outputs.submit == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # wingetcreate submits from a directory of manifests and opens the pull
          # request against microsoft/winget-pkgs.
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN packaging\winget\manifests
