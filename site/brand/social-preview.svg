<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- ==========================================================================
       The share card. This is the whole of Samong for most people who ever see
       it: a link in a feed, at maybe a quarter of this size, for about a second.

       Two rules follow from that.

       It has to work at thumbnail scale. The wordmark and the claim carry the
       card; nothing below 20px is asked to be read, and the graph on the right
       is atmosphere rather than information — no note labels, because at 320px
       wide they would be four pixels tall and merely dirty.

       And it has to be visible. The previous version put its graph at 10% and
       16% opacity, which is the same mistake the hero's ambient field had made:
       drawn, paid for, and not perceptible. The constellation here sits at
       25-85%, the lit node carries a real glow, and the graph is a composed
       layout rather than a zigzag — so the card shows the product's one
       distinctive act, a question finding its answer, instead of decoration.

       Rasterised by packaging/site/make-social-card.py, which loads the real
       woff2 files so the headline is genuinely Bai Jamjuree and not whatever
       the rasterising machine happened to have installed.
       ========================================================================== -->
  <defs>
    <radialGradient id="cloudA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a7fd4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4a7fd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a35fc4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a35fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f9b7e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0f9b7e" stop-opacity="0"/>
    </radialGradient>
    <!-- Deliberately weak. At 0.55 the halo stopped being a glow and became a
         yellow smudge that swallowed the nodes and links around it; the lit node
         needs to be the brightest thing on the right, not the largest. -->
    <radialGradient id="litGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8f24a" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#d8f24a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d8f24a" stop-opacity="0"/>
    </radialGradient>
    <!-- Deepens the lower half so the install chip and the domain sit on ground
         rather than floating on a flat fill. -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1014" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0d1014"/>
  <ellipse cx="1010" cy="250" rx="430" ry="330" fill="url(#cloudA)"/>
  <ellipse cx="760" cy="520" rx="380" ry="260" fill="url(#cloudB)"/>
  <ellipse cx="1180" cy="470" rx="300" ry="240" fill="url(#cloudC)"/>
  <rect width="1280" height="640" fill="url(#ground)"/>

  <!-- ============================ the constellation ======================== -->
  <!-- Right of the words, clear of them. Links first so no line crosses a node. -->
  <g stroke="#6e7a8c" stroke-width="1.6" opacity="0.34">
    <path d="M812 168 L906 122"/><path d="M906 122 L1002 176"/>
    <path d="M1002 176 L1086 128"/><path d="M1086 128 L1158 196"/>
    <path d="M812 168 L864 262"/><path d="M906 122 L960 254"/>
    <path d="M1002 176 L1048 240"/><path d="M1158 196 L1132 298"/>
    <path d="M864 262 L960 254"/><path d="M960 254 L1048 240"/>
    <path d="M1048 240 L1132 298"/>
    <path d="M864 262 L806 350"/><path d="M960 254 L900 358"/>
    <path d="M1048 240 L996 338"/><path d="M1132 298 L1086 392"/>
    <path d="M806 350 L900 358"/><path d="M900 358 L996 338"/>
    <path d="M996 338 L1086 392"/>
    <path d="M806 350 L862 448"/><path d="M900 358 L958 452"/>
    <path d="M996 338 L958 452"/><path d="M1086 392 L1056 476"/>
    <path d="M862 448 L958 452"/><path d="M958 452 L1056 476"/>
  </g>
  <!-- The link the answer arrived along, lit like a pulse in the hero field. -->
  <g stroke="#d8f24a" stroke-width="2.4" opacity="0.5" stroke-linecap="round">
    <path d="M1048 240 L996 338"/>
  </g>

  <!-- Nodes, in the four hues the product assigns to note collections. Radii
       vary with how connected each note is, exactly as the app draws them. -->
  <g opacity="0.82">
    <circle cx="812" cy="168" r="7" fill="#4a7fd4"/>
    <circle cx="906" cy="122" r="9" fill="#0f9b7e"/>
    <circle cx="1002" cy="176" r="8" fill="#a35fc4"/>
    <circle cx="1086" cy="128" r="6" fill="#4a7fd4"/>
    <circle cx="1158" cy="196" r="7" fill="#c47b16"/>
    <circle cx="864" cy="262" r="8" fill="#c47b16"/>
    <circle cx="960" cy="254" r="10" fill="#4a7fd4"/>
    <circle cx="1048" cy="240" r="9" fill="#0f9b7e"/>
    <circle cx="1132" cy="298" r="7" fill="#a35fc4"/>
    <circle cx="806" cy="350" r="6" fill="#0f9b7e"/>
    <circle cx="900" cy="358" r="8" fill="#a35fc4"/>
    <circle cx="1086" cy="392" r="7" fill="#4a7fd4"/>
    <circle cx="862" cy="448" r="7" fill="#4a7fd4"/>
    <circle cx="958" cy="452" r="9" fill="#c47b16"/>
    <circle cx="1056" cy="476" r="6" fill="#0f9b7e"/>
  </g>

  <!-- The match. One node, lit, with the ring the app draws around a result —
       the only thing on the right side that should catch the eye first. -->
  <circle cx="996" cy="338" r="98" fill="url(#litGlow)"/>
  <circle cx="996" cy="338" r="34" fill="none" stroke="#d8f24a" stroke-width="1.4" opacity="0.4"/>
  <circle cx="996" cy="338" r="52" fill="none" stroke="#d8f24a" stroke-width="1.2" opacity="0.18"/>
  <circle cx="996" cy="338" r="15" fill="#d8f24a"/>

  <!-- ================================ the words ============================ -->
  <g transform="translate(96 116)">
    <g transform="scale(3.25)">
      <g fill="none" stroke="#8792a3" stroke-width="1.5" stroke-linecap="round">
        <path d="M9 9.5 22.5 7"/>
        <path d="M9 9.5 20.5 20.5"/>
        <path d="M8.5 22.5 20 21.5"/>
        <path d="M9 9.5 8.5 22.5"/>
      </g>
      <circle cx="9" cy="9.5" r="3.4" fill="#e8ecf2"/>
      <circle cx="22.5" cy="7" r="2.3" fill="#8792a3"/>
      <circle cx="8.5" cy="22.5" r="2.3" fill="#8792a3"/>
      <circle cx="21.5" cy="21.5" r="5.2" fill="#d8f24a"/>
    </g>
  </g>
  <!-- Wordmark is 3592x911 outlined; scaled to 470px wide beside the mark. -->
  <g transform="translate(232 146) scale(0.1308)"><path fill="#e8ecf2" d="M0.0 483H136.0Q136.0 535 162.5 564.5Q189.0 594 236.0 594H347.0Q391.0 594 418.5 575.5Q446.0 557 446.0 526V492Q446.0 443 374.0 431L190.0 400Q100.0 385 53.5 342.5Q7.0 300 7.0 234V178Q7.0 125 35.5 84.5Q64.0 44 116.5 22.0Q169.0 0 238.0 0H351.0Q416.0 0 466.0 27.0Q516.0 54 543.5 102.5Q571.0 151 571.0 215H435.0Q435.0 173 412.0 147.5Q389.0 122 351.0 122H238.0Q196.0 122 170.5 140.0Q145.0 158 145.0 188V215Q145.0 265 214.0 277L397.0 309Q488.0 325 536.0 365.5Q584.0 406 584.0 470V536Q584.0 589 554.5 630.0Q525.0 671 472.0 693.5Q419.0 716 349.0 716H234.0Q124.0 716 62.0 654.5Q0.0 593 0.0 483Z"/>
  <path fill="#e8ecf2" d="M620.0 574V537Q620.0 474 670.0 435.5Q720.0 397 802.0 397H863.0Q889.0 397 919.0 404.0Q949.0 411 974.0 423V371Q974.0 346 957.5 330.5Q941.0 315 914.0 315H828.0Q800.0 315 783.0 328.0Q766.0 341 766.0 363H634.0Q634.0 290 687.5 245.5Q741.0 201 828.0 201H914.0Q1002.0 201 1056.0 247.5Q1110.0 294 1110.0 371V708H984.0V648Q960.0 679 925.0 697.5Q890.0 716 856.0 716H794.0Q716.0 716 668.0 677.0Q620.0 638 620.0 574ZM866.0 612Q903.0 612 932.0 593.0Q961.0 574 974.0 542V525Q958.0 513 929.5 506.0Q901.0 499 869.0 499H806.0Q782.0 499 767.0 511.0Q752.0 523 752.0 543V569Q752.0 588 768.5 600.0Q785.0 612 812.0 612Z"/>
  <path fill="#e8ecf2" d="M1918.0 380V708H1782.0V380Q1782.0 352 1769.0 335.5Q1756.0 319 1735.0 319H1692.0Q1664.0 319 1643.0 339.5Q1622.0 360 1617.0 394V708H1481.0V381Q1481.0 353 1468.0 336.0Q1455.0 319 1434.0 319H1395.0Q1366.0 319 1344.0 345.0Q1322.0 371 1316.0 413V708H1180.0V209H1306.0V267Q1324.0 237 1352.5 219.0Q1381.0 201 1410.0 201H1466.0Q1502.0 201 1531.5 220.0Q1561.0 239 1578.0 273Q1600.0 239 1630.5 220.0Q1661.0 201 1695.0 201H1750.0Q1826.0 201 1872.0 250.5Q1918.0 300 1918.0 380Z"/>
  <path fill="#d8f24a" d="M1968.0 518V401Q1968.0 342 1995.0 296.5Q2022.0 251 2070.5 226.0Q2119.0 201 2182.0 201H2272.0Q2335.0 201 2383.5 226.0Q2432.0 251 2459.0 296.5Q2486.0 342 2486.0 401V518Q2486.0 577 2459.0 622.0Q2432.0 667 2383.5 691.5Q2335.0 716 2271.0 716H2181.0Q2118.0 716 2069.5 691.5Q2021.0 667 1994.5 622.0Q1968.0 577 1968.0 518ZM2269.0 599Q2306.0 599 2328.0 573.5Q2350.0 548 2350.0 507V410Q2350.0 369 2328.0 343.5Q2306.0 318 2270.0 318H2184.0Q2148.0 318 2126.0 343.5Q2104.0 369 2104.0 410V507Q2104.0 548 2126.0 573.5Q2148.0 599 2183.0 599Z"/>
  <path fill="#e8ecf2" d="M2542.0 209H2668.0V269Q2690.0 238 2725.0 219.5Q2760.0 201 2795.0 201H2855.0Q2935.0 201 2983.5 251.0Q3032.0 301 3032.0 383V708H2896.0V388Q2896.0 357 2879.5 338.0Q2863.0 319 2837.0 319H2777.0Q2742.0 319 2714.5 344.5Q2687.0 370 2678.0 411V708H2542.0Z"/>
  <path fill="#e8ecf2" d="M3104.0 746H3238.0Q3240.0 768 3256.0 781.5Q3272.0 795 3296.0 795H3386.0Q3417.0 795 3436.5 769.5Q3456.0 744 3456.0 703V656Q3436.0 678 3407.5 691.0Q3379.0 704 3353.0 704H3284.0Q3193.0 704 3137.5 650.0Q3082.0 596 3082.0 508V406Q3082.0 345 3108.0 298.5Q3134.0 252 3181.0 226.5Q3228.0 201 3289.0 201H3347.0Q3381.0 201 3413.5 217.0Q3446.0 233 3466.0 259V209H3592.0V703Q3592.0 765 3566.5 812.0Q3541.0 859 3494.0 885.0Q3447.0 911 3386.0 911H3296.0Q3216.0 911 3163.0 865.5Q3110.0 820 3104.0 746ZM3362.0 589Q3400.0 589 3426.0 557.5Q3452.0 526 3456.0 475V406Q3452.0 366 3429.0 342.0Q3406.0 318 3371.0 318H3301.0Q3264.0 318 3241.0 345.0Q3218.0 372 3218.0 416V498Q3218.0 539 3239.0 564.0Q3260.0 589 3293.0 589Z"/></g>

  <!-- The claim, in the display face, with "already" marked the way the product
       marks a match — the same device as the page's own h1. -->
  <text x="96" y="352" font-family="Bai Jamjuree" font-size="56" font-weight="700"
        letter-spacing="-2">
    <tspan fill="#e8ecf2">You </tspan><tspan fill="#d8f24a">already</tspan><tspan fill="#e8ecf2"> solved</tspan>
  </text>
  <text x="96" y="412" font-family="Bai Jamjuree" font-size="56" font-weight="700"
        letter-spacing="-2" fill="#e8ecf2">this once.</text>

  <text x="98" y="464" fill="#b7bfcc" font-family="Plex Thai" font-size="25">
    Local-first knowledge base. Your notes never leave the machine.
  </text>
  <text x="98" y="504" fill="#8792a3" font-family="Plex Mono" font-size="20">
    full-text search · wikilink graph · MCP server for agents
  </text>

  <g transform="translate(96 542)">
    <rect x="0" y="0" width="292" height="48" rx="10" fill="#14181e" stroke="#39414e"/>
    <text x="19" y="31" fill="#d8f24a" font-family="Plex Mono" font-size="20">$ cargo install samong</text>
  </g>
  <text x="1184" y="573" fill="#8792a3" text-anchor="end"
        font-family="Plex Mono" font-size="21">samong.dev</text>
</svg>
