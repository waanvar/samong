  machine with no webfont, a print shop with no licence, and a vinyl cutter.

  The "o" carries the accent because it is the lit node from the mark: the name
  and the idea are one gesture.

  Bai Jamjuree is OFL-1.1 (Cadson Demak). The licence governs distributing the
  font software; outlined artwork is not font software, so this file and anything
