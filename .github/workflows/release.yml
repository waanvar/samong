name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            archive: tar
          - os: windows-latest
            target: x86_64-windows
            archive: zip
          - os: macos-latest
            target: aarch64-macos
            archive: tar
          # Intel Macs are still a meaningful share. This used to ask for a
          # `macos-13` runner to build natively; that image has been retired, so
          # the job sat queued forever — v0.3.0 waited nearly six hours and never
          # produced this archive. Cross-compiling from the arm64 runner needs no
          # special image: macOS ships both slices of the SDK.
          - os: macos-latest
            target: x86_64-macos
            archive: tar
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build binaries
        shell: bash
        # --locked: a release must build from the committed Cargo.lock, not from
        # whatever resolved newest today.
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --release --bins --locked --target "${{ matrix.rust_target }}"
          else
            cargo build --release --bins --locked
          fi

      - name: Package
        shell: bash
        run: |
          name="samong-${{ github.ref_name }}-${{ matrix.target }}"
          # A cross build lands under target/<triple>/release instead.
          bin="target/release"
          if [ -n "${{ matrix.rust_target }}" ]; then
            bin="target/${{ matrix.rust_target }}/release"
          fi
          mkdir -p "stage/$name"
          cp "$bin"/samong* "stage/$name/" 2>/dev/null || true
          rm -f "stage/$name/"*.d "stage/$name/"*.pdb
          # The web UI is embedded into samong-server, so the archive is just
          # the binaries + docs. NOTICE and THIRD-PARTY.md must travel with the
          # binaries: Apache-2.0 requires attribution to survive redistribution.
          cp README.md README.en.md LICENSE NOTICE THIRD-PARTY.md "stage/$name/"
          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$name.zip" "$name"
            archive="$name.zip"
          else
            tar czf "../$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          cd ..
          # A checksum beside each archive, so anyone downloading an unsigned
          # binary can at least verify they got the file we published.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            samong-*.zip
            samong-*.tar.gz
            samong-*.sha256
