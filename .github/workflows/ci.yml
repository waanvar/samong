name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # --locked everywhere: CI has to judge the dependency set we actually ship,
      # not whatever resolved newest this morning. Without it a green CI says
      # nothing about the binaries the release workflow builds, and an upstream
      # release can turn main red with no change of ours.
      - name: Build
        run: cargo build --all --locked --verbose

      - name: Test
        run: cargo test --all --locked --verbose

      - name: Clippy
        run: cargo clippy --all --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # The `semantic` feature is off by default and the release binaries never carry
  # it, so nothing else in this file would ever compile it. It still has to be
  # kept working, and it cannot be checked on every machine: the prebuilt ONNX
  # Runtime that `ort` downloads is compiled against a newer MSVC STL than some
  # Windows toolchains ship, which links with 40 unresolved `__std_*_element`
  # symbols. Linux links it cleanly, so this is where the feature gets verified.
  #
  # The model download is deliberately not exercised — it is 465 MB from Hugging
  # Face and would make CI slow and network-dependent. What runs here is
  # everything up to the model: compile, link, the vector store, and chunking.
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test with semantic search compiled in
        run: cargo test --features semantic --locked --verbose

      - name: Clippy
        run: cargo clippy --features semantic --all-targets --locked -- -D warnings

  # What `cargo publish` would actually upload.
  #
  # The web UI is embedded at compile time from `web/dist`, which is gitignored —
  # so `cargo package` excludes it unless `include` in Cargo.toml overrides that.
  # Get this wrong and `cargo install samong` yields a server with no interface
  # and a launcher that opens a browser onto nothing. Neither the `test` job
  # (no Node) nor the `web` job (no Rust) can see it, which is why this exists.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The package must carry the built UI
        run: |
          cargo package --list --locked --allow-dirty > /tmp/pkg.txt
          echo "--- web/ entries in the package ---"
          grep '^web/' /tmp/pkg.txt || true
          for required in web/dist/index.html assets/words_th.txt Cargo.toml README.md LICENSE NOTICE THIRD-PARTY.md; do
            grep -qx "$required" /tmp/pkg.txt || { echo "::error::$required is missing from the published package"; exit 1; }
          done
          # Assets are hashed filenames, so assert by count rather than by name.
          n=$(grep -c '^web/dist/assets/' /tmp/pkg.txt || true)
          [ "$n" -gt 0 ] || { echo "::error::no built assets in the package"; exit 1; }
          echo "package carries the UI: $n asset file(s)"

      - name: Dry-run the publish
        run: cargo publish --dry-run --locked --allow-dirty

      # v0.3.7's registry publish was rejected for a description of 168 characters
      # against a documented limit of 100. The limit was in the schema all along;
      # reading a schema is not validating against it.
      - name: server.json must satisfy the registry schema
        run: python3 packaging/mcpb/validate-server-json.py server.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (includes type-check)
        working-directory: web
        run: npm run build
