<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Samong">
  <title>Samong</title>
  <!--
    The mark is the product's one act: a small network with exactly one node lit.
    That is what Samong does — you ask, and the thing you needed is the one that
    lights up. The lit node is the only element that ever wears the accent
    colour, here and in the app.

    Drawn geometry, no font and no gradient: it survives a 16px favicon, a
    one-colour screen print, and an embroidery needle. Four circles and four
    lines is the whole vocabulary.
  -->
  <g fill="none" stroke="#8792a3" stroke-width="1.5" stroke-linecap="round">
    <path d="M9 9.5 22.5 7"/>
    <path d="M9 9.5 20.5 20.5"/>
    <path d="M8.5 22.5 20 21.5"/>
    <path d="M9 9.5 8.5 22.5"/>
  </g>
  <circle cx="9" cy="9.5" r="3.4" fill="#e8ecf2"/>
  <circle cx="22.5" cy="7" r="2.3" fill="#8792a3"/>
  <circle cx="8.5" cy="22.5" r="2.3" fill="#8792a3"/>
  <!-- found -->
  <circle cx="21.5" cy="21.5" r="5.2" fill="#d8f24a"/>
</svg>
