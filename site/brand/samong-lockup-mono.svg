  The locked-up brand: mark, a fixed gap, then the outlined name.

  The proportions are the ones the site already used at hero size, expressed in
  em of the wordmark so they hold at any scale: mark 1.208em, gap 0.283em. The
  mark is centred on the cap-height midpoint of the name.

  Use this whenever there is room. The mark alone is for favicons, app icons and
  anywhere under about 32px, where the name would not be legible anyway.
-->
