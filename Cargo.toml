[package]
name = "banyan"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Local-first, Obsidian-compatible knowledge base CLI with fast link graph and full-text search"

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["derive"] }
nlpo3 = "1.4.0"
notify = "8.2.0"
redb = "2.6.3"
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tantivy = "0.26.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
futures-util = "0.3.32"
predicates = "3.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
